<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc" rx="16"/>
  
  <!-- Title & Labels -->
  <text x="400" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">The "Clean Data" Paradox</text>
  <text x="400" y="80" text-anchor="middle" font-size="16" fill="#64748b">Why overly manicured datasets lose their predictive power</text>
  
  <!-- Axis -->
  <!-- Y Axis (Real-world Value) -->
  <line x1="100" y1="500" x2="100" y2="150" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="80" y="325" fill="#475569" font-size="16" font-weight="600" text-anchor="middle" transform="rotate(-90, 80, 325)">Real-World Value (Signal)</text>
  
  <!-- X Axis (Data Cleaning Level) -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="400" y="540" fill="#475569" font-size="16" font-weight="600" text-anchor="middle">Level of Aggressive Data Cleaning ("Scrubbing")</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <!-- We need a red arrow for the trendline -->
    <marker id="redarrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="gradTopRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="gradTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <linearGradient id="gradBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="gradBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Quadrants -->
  <!-- Top Left (High Value, Low Cleaning) -->
  <rect x="110" y="160" width="280" height="150" fill="url(#gradTopLeft)"  rx="8" stroke="#fde047" stroke-width="2"/>
  <text x="250" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#854d0e">The Rough Diamond</text>
  <text x="250" y="240" text-anchor="middle" font-size="14" fill="#a16207">Contains true anomalies, edge cases,</text>
  <text x="250" y="260" text-anchor="middle" font-size="14" fill="#a16207">and "the alpha." Hard to parse.</text>
  
  <!-- Top Right (High Value, High Cleaning) -->
  <rect x="410" y="160" width="280" height="150" fill="url(#gradTopRight)" rx="8" stroke="#93c5fd" stroke-width="2"/>
  <text x="550" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">The Holy Grail</text>
  <text x="550" y="240" text-anchor="middle" font-size="14" fill="#1d4ed8">Pristine AND comprehensive.</text>
  <text x="550" y="260" text-anchor="middle" font-size="14" fill="#1d4ed8">Takes months to build, breaks next week.</text>

  <!-- Bottom Left (Low Value, Low Cleaning) -->
  <rect x="110" y="330" width="280" height="150" fill="url(#gradBottomLeft)" rx="8" stroke="#fca5a5" stroke-width="2"/>
  <text x="250" y="380" text-anchor="middle" font-size="20" font-weight="bold" fill="#991b1b">The Data Swamp</text>
  <text x="250" y="410" text-anchor="middle" font-size="14" fill="#b91c1c">Just pure noise. Missing values,</text>
  <text x="250" y="430" text-anchor="middle" font-size="14" fill="#b91c1c">duplicated rows, useless logs.</text>

  <!-- Bottom Right (Low Value, High Cleaning) -->
  <rect x="410" y="330" width="280" height="150" fill="url(#gradBottomRight)" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="550" y="380" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">The Sterile Dashboard</text>
  <text x="550" y="410" text-anchor="middle" font-size="14" fill="#475569">Over-processed. Aggregations hide</text>
  <text x="550" y="430" text-anchor="middle" font-size="14" fill="#475569">all real-world nuances and shifts.</text>
  
  <!-- Trend Line showing actual trajectory of many teams -->
  <path d="M 280 180 Q 400 130, 520 330" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10,5" marker-end="url(#redarrow)"/>
  
  <text x="440" y="240" fill="#ef4444" font-size="14" font-weight="bold" transform="rotate(35, 440, 240)">Typical "Improvement" Path</text>
</svg>
